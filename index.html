<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>index.ai</title>

<!-- FONT: Aktiv Grotesk via Adobe Fonts -->
<link rel="stylesheet" href="https://use.typekit.net/onp4cuh.css">

<style>
/* ============================================================
   index.ai — Redesign V1 + archive
   ------------------------------------------------------------
   Grid     36 | 141 | 329 | 329 | 329 | 36   (1200 max)
   Rules    hairlines on every column edge
   Type     Golden-ratio scale from 12: 8 / 11 / 12 / 19.5
   Unit     Every news story is a block, added to its column.
   Weeks    Each week is a horizontal band.
   Archive  Left column lists every week. Selecting one scrolls
            to it; the top-left label rolls to show the week
            in view.
   ============================================================ */

:root {
  /* Colour */
  --bg:        #fafafa;
  --fg:        #0a0a0a;
  --mid:       #808080;   /* 50% tint of black */
  --line:      0.5px solid var(--fg);
  --line-soft: 0.5px solid var(--mid);

  /* Type */
  --sans:      'aktiv-grotesk', system-ui, sans-serif;
  --t-xs:      8px;       /* source, summary      — 8 / 12      */
  --t-s:       11px;      /* tagline              — 11 / 14.4   */
  --t-m:       12px;      /* title, heads, archive — 12 / 12    */
  --t-l:       19.5px;    /* headline             — 19.5 / 23.4 */

  /* Grid */
  --margin:    36px;
  --meta:      141px;
  --row:       35px;      /* header row + archive rows */
  --inset:     12px;      /* text indent from column rule */
  --inset-r:   36px;      /* right indent on small text */
  --unit:      12px;      /* vertical rhythm */
  --max:       1200px;

  /* Motion */
  --dur-1:     120ms;     /* hover */
  --dur-2:     360ms;     /* label roll */
  --ease-move: cubic-bezier(0.4, 0, 0.2, 1);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  font-family: var(--sans);
  font-weight: 400;
  background: var(--bg);
  color: var(--fg);
  font-size: var(--t-m);
  line-height: 1;
  -webkit-font-smoothing: antialiased;
}

a { color: inherit; text-decoration: none; }

.page {
  max-width: var(--max);
  margin: 0 auto;
  padding: 0 var(--margin);
}

.grid  { display: grid; grid-template-columns: var(--meta) repeat(3, 1fr); }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); }

/* Every cell carries a left rule; the last one closes the right edge */
.cells > * { border-left: var(--line); }
.cells > :last-child { border-right: var(--line); }

/* ============================================================
   FIXED TOP — masthead + header row stay put
   ============================================================ */

.top {
  position: sticky;
  top: 0;
  z-index: 10;
  background: var(--bg);
}

.masthead {
  height: 113px;
  padding-top: var(--margin);
}

.title {
  padding-left: var(--inset);
  font-size: var(--t-m);
  font-weight: 400;
  line-height: 12px;
}

.tagline {
  grid-column: 2 / 4;
  padding-left: var(--inset);
  font-size: var(--t-s);
  line-height: 14.4px;
  color: var(--mid);
}

.heads {
  height: var(--row);
  border-top: var(--line);
  border-bottom: var(--line);
}

.heads > div {
  display: flex;
  align-items: center;
  padding: 0 var(--inset);
  font-size: var(--t-m);
  line-height: 12px;
  text-transform: uppercase;
}

/* ============================================================
   WEEK LABEL — top-left cell. Text rolls vertically when the
   week in view changes: down the archive = rolls up, back up
   the archive = rolls down.
   ============================================================ */

.heads > .week-label {
  position: relative;
  overflow: hidden;
  padding: 0;
  text-transform: none;
}

.week-label span {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  padding: 0 var(--inset);
  white-space: nowrap;
  transition: transform var(--dur-2) var(--ease-move);
}

/* ============================================================
   BODY — archive column + week bands
   ============================================================ */

.body {
  border-bottom: var(--line);
}

.archive {
  border-left: var(--line);
}

.archive ul {
  position: sticky;
  top: var(--head, 148px);
  list-style: none;
}

.archive a {
  display: flex;
  align-items: center;
  height: var(--row);
  padding: 0 var(--inset);
  border-bottom: var(--line-soft);
  font-size: var(--t-m);
  line-height: 12px;
  transition: color var(--dur-1);
}

.archive a:hover { color: var(--mid); }

#weeks { grid-column: 2 / 5; }

.week {
  scroll-margin-top: var(--head, 148px);
}

.week + .week { border-top: var(--line); }

/* The oldest week can still scroll up to sit under the header */
.week:last-child { min-height: calc(100vh - var(--head, 148px)); }

.week-mobile { display: none; }   /* mobile only */
.strand-label { display: none; }  /* mobile only */

/* ============================================================
   BLOCK — one news story
   ============================================================ */

.block {
  padding: var(--unit) 0 calc(var(--unit) * 2);
  border-bottom: var(--line);
}

/* The week rule closes each band, so the last block needs no rule of its own */
.strand > .block:last-child { border-bottom: none; }

.block-image {
  margin: 0 var(--inset) var(--unit);
  aspect-ratio: 3 / 2;
  overflow: hidden;
  background: #e8e8e8;
}

.block-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.source,
.summary {
  padding: 0 var(--inset-r) 0 var(--inset);
  font-size: var(--t-xs);
  line-height: 12px;
  color: var(--mid);
}

/* Even spacing: source — 6px — headline — 6px — summary */
.source { margin-bottom: 6px; }

.headline {
  padding: 0 var(--inset);
  font-size: var(--t-l);
  font-weight: 400;
  line-height: 23.4px;
  margin-bottom: 6px;
}

.headline a:hover {
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 3px;
}

.state-msg {
  padding: var(--unit) var(--inset);
  font-size: var(--t-s);
  line-height: 14.4px;
  color: var(--mid);
}

/* ============================================================
   REDUCED MOTION — jump instead of scroll, swap instead of roll
   ============================================================ */

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .week-label span { transition: none; }
}

/* ============================================================
   MOBILE — single column, archive hidden, week date inline
   ============================================================ */

@media (max-width: 860px) {
  :root { --margin: 16px; }

  .grid, .grid3    { grid-template-columns: 1fr; }
  .cells > *       { border-left: none; border-right: none; }

  .masthead        { height: auto; padding: 20px 0 12px; border-bottom: var(--line); }
  .title,
  .tagline         { padding-left: 0; }
  .tagline         { grid-column: 1; margin-top: 8px; }

  .heads, .archive { display: none; }
  #weeks           { grid-column: 1; }
  .body            { border-bottom: none; }

  .week-mobile     { display: block; padding: 7px 0; border-bottom: var(--line); font-size: var(--t-m); line-height: 14.4px; color: var(--mid); }
  .strand-label    { display: block; padding: 14px 0 0; font-size: var(--t-m); line-height: 12px; text-transform: uppercase; }

  .block-image,
  .source,
  .summary,
  .headline        { margin-left: 0; margin-right: 0; padding-left: 0; padding-right: 0; }
  .source, .summary { font-size: 11px; line-height: 14.4px; }
}
</style>
</head>
<body>
<div class="page">

  <header class="top">
    <div class="masthead grid">
      <h1 class="title">index.ai</h1>
      <p class="tagline">A weekly index of AI and the creative industries<br>Curated for BA Graphic &amp; Media Design</p>
    </div>
    <div class="heads grid cells">
      <div class="week-label" id="week-label" aria-live="polite"><span>Current week →</span></div>
      <div>The Creative Industry &amp; AI</div>
      <div>The Environmental Impact of AI</div>
      <div>The Creative Response to AI</div>
    </div>
  </header>

  <div class="body grid">
    <nav class="archive" aria-label="Archive">
      <ul id="archive"></ul>
    </nav>
    <main id="weeks"></main>
  </div>

</div>
<script>
/* ============================================================
   DATA
   content.json  — the current week (unchanged format):
                   { lastUpdated, weekOf?, a:[], b:[], c:[] }
   archive.json  — optional, past weeks, newest first:
                   [ { weekOf, a:[], b:[], c:[] }, ... ]
   ============================================================ */

const CONTENT_URL = './content.json';
const ARCHIVE_URL = './archive.json';
const STRANDS = [
  ['a', 'The Creative Industry & AI'],
  ['b', 'The Environmental Impact of AI'],
  ['c', 'The Creative Response to AI']
];

async function getJSON(url) {
  try {
    const res = await fetch(url + '?t=' + Date.now());
    return res.ok ? await res.json() : null;
  } catch { return null; }
}

async function load() {
  const [current, archive] = await Promise.all([getJSON(CONTENT_URL), getJSON(ARCHIVE_URL)]);
  const weeks = [];
  if (current) {
    if (Array.isArray(current.weeks)) weeks.push(...current.weeks);
    else weeks.push({ weekOf: current.weekOf || current.lastUpdated, a: current.a, b: current.b, c: current.c });
  }
  if (Array.isArray(archive)) weeks.push(...archive);

  const main = document.getElementById('weeks');
  if (!weeks.length) {
    main.innerHTML = '<p class="state-msg">Content unavailable — check back soon.</p>';
    return;
  }

  weeks.forEach((w, i) => {
    w.id    = 'week-' + isoDate(w.weekOf, i);
    w.short = formatShort(w.weekOf);
    w.label = i === 0 ? 'Current week →' : `Week of ${w.short} →`;
  });

  document.getElementById('archive').innerHTML = weeks.map(w =>
    `<li><a href="#${w.id}" data-id="${w.id}">Week of ${esc(w.short)}</a></li>`).join('');
  main.innerHTML = weeks.map(renderWeek).join('');

  setupWeeks(weeks);
}

/* ============================================================
   RENDER
   ============================================================ */

function approved(list) { return (list || []).filter(i => i.status === 'approved'); }

function renderWeek(week) {
  return `
    <section class="week grid3 cells" id="${week.id}">
      <div class="week-mobile">Week of ${esc(week.short)}</div>
      ${STRANDS.map(([k, label]) => `
        <div class="strand">
          <div class="strand-label">${esc(label)}</div>
          ${approved(week[k]).map(renderBlock).join('') || '<p class="state-msg">No items this week.</p>'}
        </div>`).join('')}
    </section>`;
}

function renderBlock(item) {
  const img = item.image
    ? `<div class="block-image"><img src="${esc(item.image)}" alt="" loading="lazy" onerror="this.parentElement.remove()"></div>`
    : '';
  const headline = item.url
    ? `<a href="${esc(item.url)}" target="_blank" rel="noopener">${esc(item.headline)}</a>`
    : esc(item.headline);
  return `
    <article class="block">
      ${img}
      <p class="source">${esc(item.source)}</p>
      <h2 class="headline">${headline}</h2>
      <p class="summary">${esc(item.summary)}</p>
    </article>`;
}

/* DD.MM.YY */
function formatShort(value) {
  const d = value ? new Date(value) : null;
  if (!d || isNaN(d)) return '';
  const p = n => String(n).padStart(2, '0');
  return `${p(d.getDate())}.${p(d.getMonth() + 1)}.${String(d.getFullYear()).slice(2)}`;
}

/* YYYY-MM-DD for ids; falls back to position if the date is missing */
function isoDate(value, i) {
  const d = value ? new Date(value) : null;
  return d && !isNaN(d) ? d.toISOString().slice(0, 10) : 'n' + i;
}

function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ============================================================
   WEEKS — tracking, archive clicks, label roll
   ============================================================ */

function setupWeeks(weeks) {
  const top      = document.querySelector('.top');
  const labelBox = document.getElementById('week-label');
  const sections = weeks.map(w => document.getElementById(w.id));
  let activeIndex = 0;
  let locked = false;       // true while an archive click is scrolling the page
  let ticking = false;

  const headHeight = () => top.offsetHeight;
  const setHead = () => document.documentElement.style.setProperty('--head', headHeight() + 'px');

  /* Stage: roll — old text leaves, new text arrives along the vertical axis.
     Moving to an older week (further down) rolls up; newer rolls down. */
  function roll(toIndex) {
    if (toIndex === activeIndex) return;
    const dir  = toIndex > activeIndex ? 1 : -1;
    const old  = labelBox.querySelector('span:last-child');
    const next = document.createElement('span');
    next.textContent = weeks[toIndex].label;
    next.style.transform = `translateY(${dir * 100}%)`;
    labelBox.appendChild(next);
    next.getBoundingClientRect();                 // commit start position
    next.style.transform = 'translateY(0)';
    if (old) {
      old.style.transform = `translateY(${-dir * 100}%)`;
      const remove = () => old.remove();
      old.addEventListener('transitionend', remove, { once: true });
      setTimeout(remove, 600);                    // fallback, e.g. reduced motion
    }
    activeIndex = toIndex;
  }

  /* Stage: track — which week band sits under the fixed header */
  function track() {
    ticking = false;
    if (locked) return;
    const h = headHeight();
    let idx = 0;
    sections.forEach((s, i) => { if (s.getBoundingClientRect().top <= h + 1) idx = i; });
    roll(idx);
  }

  /* Stage: select — archive click rolls the label once, then scrolls */
  document.getElementById('archive').addEventListener('click', e => {
    const a = e.target.closest('a[data-id]');
    if (!a) return;
    e.preventDefault();
    const idx = weeks.findIndex(w => w.id === a.dataset.id);
    locked = true;
    roll(idx);
    sections[idx].scrollIntoView({ block: 'start' });
    history.replaceState(null, '', '#' + weeks[idx].id);
    const unlock = () => { locked = false; };
    if ('onscrollend' in window) window.addEventListener('scrollend', unlock, { once: true });
    setTimeout(unlock, 1200);                     // fallback for browsers without scrollend
  });

  window.addEventListener('scroll', () => {
    if (!ticking) { ticking = true; requestAnimationFrame(track); }
  }, { passive: true });
  window.addEventListener('resize', () => { setHead(); track(); });

  setHead();

  /* Opened with a week in the address, e.g. …/#week-2026-10-05 */
  const fromHash = weeks.findIndex(w => '#' + w.id === location.hash);
  if (fromHash > 0) {
    sections[fromHash].scrollIntoView({ behavior: 'instant', block: 'start' });
    roll(fromHash);
  }
}

load();
</script>

</html>
