<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" href="https://use.typekit.net/onp4cuh.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>index.ai</title>

<!-- FONT: Aktiv Grotesk via Adobe Fonts -->
<link rel="stylesheet" href="https://use.typekit.net/onp4cuh.css">

<style>
/* ============================================================
   index.ai — Redesign V1 (built from Redesign_V1.idml)
   ------------------------------------------------------------
   Grid     36 | 141 | 329 | 329 | 329 | 36   (1200 max)
   Rules    0.25pt black hairlines on every column edge
   Type     Golden-ratio scale from 12: 8 / 11 / 12 / 19.5
   Unit     Every news story is a block, added to its column.
   Weeks    Each week is a horizontal band. Scrolling past the
            end of a band flicks the date + count to the next.
   ============================================================ */

:root {
  /* Colour */
  --bg:        #fafafa;
  --fg:        #0a0a0a;
  --mid:       #808080;   /* 50% tint of black */
  --line:      0.5px solid var(--fg);

  /* Type */
  --sans:      'aktiv-grotesk', system-ui, sans-serif;
  --t-xs:      8px;       /* source, summary   — 8 / 12     */
  --t-s:       11px;      /* tagline, date, count — 11 / 14.4 */
  --t-m:       12px;      /* title, column heads — 12 / 12 */
  --t-l:       19.5px;    /* headline          — 19.5 / 23.4 */

  /* Grid */
  --margin:    36px;
  --meta:      141px;
  --inset:     12px;      /* text indent from column rule */
  --inset-r:   36px;      /* right indent on small text */
  --unit:      12px;      /* vertical rhythm */
  --max:       1200px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--sans);
  font-weight: 400;
  background: var(--bg);
  color: var(--fg);
  font-size: var(--t-m);
  line-height: 1;
  -webkit-font-smoothing: antialiased;
}

a { color: inherit; text-decoration: none; }

.page {
  max-width: var(--max);
  margin: 0 auto;
  padding: 0 var(--margin);
}

.grid {
  display: grid;
  grid-template-columns: var(--meta) repeat(3, 1fr);
}

/* Every cell carries a left rule; the last one closes the right edge */
.cells > * { border-left: var(--line); }
.cells > :last-child { border-right: var(--line); }

/* ============================================================
   FIXED TOP — masthead + column heads stay put
   ============================================================ */

.top {
  position: sticky;
  top: 0;
  z-index: 10;
  background: var(--bg);
}

.masthead {
  height: 113px;
  padding-top: var(--margin);
  border-bottom: var(--line);
}

.title {
  padding-left: var(--inset);
  font-size: var(--t-m);
  font-weight: 400;
  line-height: 12px;
}

.tagline {
  grid-column: 2 / 4;
  padding-left: var(--inset);
  font-size: var(--t-s);
  line-height: 14.4px;
  color: var(--mid);
}

.heads {
  height: 35px;
  border-bottom: var(--line);
}

.heads > div {
  display: flex;
  align-items: center;      /* vertically centred in the 35px row */
  padding: 0 var(--inset);
  font-size: var(--t-m);
  line-height: 12px;
  text-transform: uppercase;
}

.heads .date {
  font-size: var(--t-s);
  line-height: 14.4px;
  color: var(--mid);
  text-transform: none;
}

/* ============================================================
   WEEK BANDS
   ============================================================ */

.week { border-bottom: var(--line); }

.meta .count {
  position: sticky;
  top: var(--head, 148px);
  padding: 7px var(--inset) var(--unit);
  font-size: var(--t-s);
  line-height: 14.4px;
  color: var(--mid);
  text-transform: uppercase;
}

.strand-label { display: none; }  /* mobile only */

/* ============================================================
   BLOCK — one news story
   ============================================================ */

.block {
  padding: var(--unit) 0 calc(var(--unit) * 2);
  border-bottom: var(--line);
}

/* The week rule closes each band, so the last block needs no rule of its own */
.strand > .block:last-child { border-bottom: none; }

.block-image {
  margin: 0 var(--inset) var(--unit);
  aspect-ratio: 3 / 2;
  overflow: hidden;
  background: #e8e8e8;
}

.block-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.source,
.summary {
  padding: 0 var(--inset-r) 0 var(--inset);
  font-size: var(--t-xs);
  line-height: 12px;
  color: var(--mid);
}

/* Even spacing: source — 6px — headline — 6px — summary */
.source { margin-bottom: 6px; }

.headline {
  padding: 0 var(--inset);
  font-size: var(--t-l);
  font-weight: 400;
  line-height: 23.4px;
  margin-bottom: 6px;
}

.headline a:hover {
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 3px;
}

.state-msg {
  padding: var(--unit) var(--inset);
  font-size: var(--t-s);
  line-height: 14.4px;
  color: var(--mid);
}

/* ============================================================
   MOBILE — single column, strands stacked inside each week
   ============================================================ */

@media (max-width: 860px) {
  :root { --margin: 16px; }

  .grid            { grid-template-columns: 1fr; }
  .cells > *       { border-left: none; border-right: none; }

  .masthead        { height: auto; padding: 20px 0 12px; }
  .title,
  .tagline         { padding-left: 0; }
  .tagline         { grid-column: 1; margin-top: 8px; }

  .heads           { height: auto; padding: 7px 0; }
  .heads > div     { padding: 0; }
  .heads .strand-head { display: none; }

  .meta .count     { position: static; padding: 7px 0; border-bottom: var(--line); }

  .strand-label    { display: block; padding: 14px 0 0; font-size: var(--t-m); line-height: 12px; text-transform: uppercase; }

  .block-image,
  .source,
  .summary,
  .headline        { margin-left: 0; margin-right: 0; padding-left: 0; padding-right: 0; }
  .source, .summary { font-size: 11px; line-height: 14.4px; }
}
</style>
</head>
<body>
<div class="page">

  <header class="top">
    <div class="masthead grid">
      <h1 class="title">index.ai</h1>
      <p class="tagline">A weekly index of AI and the creative industries<br>Curated for BA Graphic &amp; Media Design</p>
    </div>
    <div class="heads grid cells">
      <div class="date" id="current-date">—</div>
      <div class="strand-head">The Creative Industry &amp; AI</div>
      <div class="strand-head">The Environmental Impact of AI</div>
      <div class="strand-head">The Creative Response to AI</div>
    </div>
  </header>

  <main id="weeks"></main>

</div>
<script>
/* ============================================================
   DATA
   content.json  — the current week (unchanged format):
                   { lastUpdated, weekOf?, a:[], b:[], c:[] }
   archive.json  — optional, past weeks, newest first:
                   [ { weekOf, a:[], b:[], c:[] }, ... ]
   ============================================================ */

const CONTENT_URL = './content.json';
const ARCHIVE_URL = './archive.json';
const STRANDS = [
  ['a', 'The Creative Industry & AI'],
  ['b', 'The Environmental Impact of AI'],
  ['c', 'The Creative Response to AI']
];

async function getJSON(url) {
  try {
    const res = await fetch(url + '?t=' + Date.now());
    return res.ok ? await res.json() : null;
  } catch { return null; }
}

async function load() {
  const [current, archive] = await Promise.all([getJSON(CONTENT_URL), getJSON(ARCHIVE_URL)]);
  const weeks = [];
  if (current) {
    if (Array.isArray(current.weeks)) weeks.push(...current.weeks);
    else weeks.push({ weekOf: current.weekOf || current.lastUpdated, a: current.a, b: current.b, c: current.c });
  }
  if (Array.isArray(archive)) weeks.push(...archive);

  const main = document.getElementById('weeks');
  if (!weeks.length) {
    main.innerHTML = '<p class="state-msg">Content unavailable — check back soon.</p>';
    return;
  }
  main.innerHTML = weeks.map(renderWeek).join('');
  setupWeekTracking();
}

/* ============================================================
   RENDER
   ============================================================ */

function approved(list) { return (list || []).filter(i => i.status === 'approved'); }

function renderWeek(week) {
  const count = STRANDS.reduce((n, [k]) => n + approved(week[k]).length, 0);
  const date  = formatDate(week.weekOf);
  return `
    <section class="week grid cells" data-date="${esc(date)}">
      <div class="meta"><div class="count">${count} ${count === 1 ? 'item' : 'items'}</div></div>
      ${STRANDS.map(([k, label]) => `
        <div class="strand">
          <div class="strand-label">${esc(label)}</div>
          ${approved(week[k]).map(renderBlock).join('') || '<p class="state-msg">No items this week.</p>'}
        </div>`).join('')}
    </section>`;
}

function renderBlock(item) {
  const img = item.image
    ? `<div class="block-image"><img src="${esc(item.image)}" alt="" loading="lazy" onerror="this.parentElement.remove()"></div>`
    : '';
  const headline = item.url
    ? `<a href="${esc(item.url)}" target="_blank" rel="noopener">${esc(item.headline)}</a>`
    : esc(item.headline);
  return `
    <article class="block">
      ${img}
      <p class="source">${esc(item.source)}</p>
      <h2 class="headline">${headline}</h2>
      <p class="summary">${esc(item.summary)}</p>
    </article>`;
}

/* DD.MM.YYYY */
function formatDate(value) {
  const d = value ? new Date(value) : null;
  if (!d || isNaN(d)) return '';
  const p = n => String(n).padStart(2, '0');
  return `${p(d.getDate())}.${p(d.getMonth() + 1)}.${d.getFullYear()}`;
}

function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ============================================================
   WEEK TRACKING — the date in the fixed header flicks to
   whichever week band is currently under it
   ============================================================ */

function setupWeekTracking() {
  const top   = document.querySelector('.top');
  const weeks = [...document.querySelectorAll('.week')];
  const label = document.getElementById('current-date');
  let ticking = false;

  function update() {
    const h = top.offsetHeight;
    document.documentElement.style.setProperty('--head', h + 'px');
    let active = weeks[0];
    for (const w of weeks) {
      if (w.getBoundingClientRect().top <= h + 1) active = w;
      else break;
    }
    if (active && label.textContent !== active.dataset.date) label.textContent = active.dataset.date;
    ticking = false;
  }

  const request = () => { if (!ticking) { ticking = true; requestAnimationFrame(update); } };
  window.addEventListener('scroll', request, { passive: true });
  window.addEventListener('resize', request);
  update();
}

load();
</script>

</html>
