<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>index.ai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gelasio:ital,wght@0,400;1,400&family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>

/* ============================================================
   index.ai — Student Page
   ============================================================
   Layout: narrow meta gutter left, three equal content columns right.
   Gelasio for headlines; Instrument Sans for everything else.
   ============================================================ */

:root {
  --bg:           #fafafa;
  --fg:           #0a0a0a;
  --mid:          #787878;
  --rule:         #e2e2e2;
  --serif:        'Gelasio', Georgia, serif;
  --sans:         'Instrument Sans', system-ui, sans-serif;
  --gutter:       140px;
  --col-gap:      32px;
  --max-width:    1200px;
  --page-pad:     28px;
}

/* Single-theme: always light — deliberate identity */

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }

body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--fg);
  font-size: 13px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

a { color: inherit; }
a:hover { opacity: 0.65; }

.page {
  max-width: var(--max-width);
  margin: 0 auto;
  padding: 0 var(--page-pad);
}

/* ============================================================
   MASTHEAD
   Same four-column grid as the content: gutter | title (cols 2–3) | meta (col 4)
   ============================================================ */

.masthead {
  display: grid;
  grid-template-columns: var(--gutter) 1fr 1fr 1fr;
  gap: var(--col-gap);
  padding: 32px 0 24px;
  border-bottom: 1px solid var(--fg);
  align-items: end;
}

.masthead-title {
  grid-column: 2 / 4;
}

.masthead-title h1 {
  font-family: var(--serif);
  font-size: 48px;
  font-weight: 400;
  line-height: 1;
  letter-spacing: -0.02em;
}

.masthead-title h1 em { font-style: italic; }

.masthead-title .tagline {
  margin-top: 8px;
  font-size: 11px;
  color: var(--mid);
}

.masthead-meta {
  grid-column: 4;
  font-size: 11px;
  color: var(--mid);
  line-height: 1.7;
  text-align: right;
}

/* ============================================================
   STRAND HEADER ROW
   ============================================================ */

.strand-row {
  display: grid;
  grid-template-columns: var(--gutter) 1fr 1fr 1fr;
  gap: var(--col-gap);
  padding: 12px 0 0;
  position: sticky;
  top: 0;
  background: var(--bg);
  z-index: 10;
}

.strand-label {
  font-size: 10px;
  font-weight: 400;
  color: var(--mid);
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

/* Labels sit over the column content, so match the column's left padding */
.strand-row .strand-label {
  padding-left: var(--col-gap);
}

/* ============================================================
   CONTENT ROW
   One vertical rule before each content column — none on the meta column
   ============================================================ */

.content-row {
  display: grid;
  grid-template-columns: var(--gutter) 1fr 1fr 1fr;
  gap: var(--col-gap);
  border-bottom: 1px solid var(--fg);
}

.meta-col {
  padding: 16px 0 32px;
}

.meta-week {
  font-size: 10px;
  color: var(--mid);
  line-height: 1.8;
}

.meta-count {
  margin-top: 16px;
  font-family: var(--serif);
  font-size: 36px;
  font-weight: 400;
  line-height: 1;
}

.meta-count-label {
  font-size: 10px;
  color: var(--mid);
  margin-top: 2px;
}

.strand-col {
  padding: 16px 0 32px var(--col-gap);
  border-left: 0.5px solid var(--rule);
}

/* ============================================================
   ITEMS
   ============================================================ */

.item {
  padding-bottom: 20px;
  margin-bottom: 20px;
  border-bottom: 0.5px solid var(--rule);
}

.item:last-child {
  border-bottom: none;
  margin-bottom: 0;
  padding-bottom: 0;
}

.item-image {
  width: 100%;
  margin-bottom: 10px;
  overflow: hidden;
  background: var(--rule);
  aspect-ratio: 16 / 9;
}

.item-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.item-source {
  font-size: 10px;
  color: var(--mid);
  letter-spacing: 0.04em;
  margin-bottom: 4px;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
}

.item-date {
  font-size: 10px;
  color: var(--rule);
}

.item-headline {
  font-family: var(--serif);
  font-size: 16px;
  font-weight: 400;
  line-height: 1.3;
  margin-bottom: 6px;
}

.item-headline a { text-decoration: none; }
.item-headline a:hover {
  text-decoration: underline;
  text-underline-offset: 3px;
  opacity: 1;
}

.item-summary {
  font-size: 12px;
  color: var(--mid);
  line-height: 1.6;
}

.state-msg {
  font-size: 11px;
  color: var(--mid);
  padding: 24px 0;
}

/* ============================================================
   FOOTER
   ============================================================ */

.site-footer {
  display: grid;
  grid-template-columns: var(--gutter) 1fr;
  gap: var(--col-gap);
  padding: 12px 0 28px;
}

.footer-note {
  font-size: 10px;
  color: var(--mid);
  letter-spacing: 0.03em;
}

/* ============================================================
   RESPONSIVE
   ============================================================ */

@media (max-width: 860px) {
  :root { --page-pad: 16px; }

  .masthead        { grid-template-columns: 1fr; gap: 12px; }
  .masthead-title,
  .masthead-meta   { grid-column: 1; text-align: left; }

  .strand-row      { display: none; }

  .content-row     { grid-template-columns: 1fr; border-bottom: none; }
  .meta-col        { display: none; }

  .strand-col      { border-left: none; padding-left: 0; border-top: 1px solid var(--fg); }
  .meta-col + .strand-col { border-top: none; }

  .site-footer     { grid-template-columns: 1fr; }
  .site-footer > :first-child { display: none; }
}

</style>
</head>
<body>
<div class="page">

  <header class="masthead">
    <div class="masthead-title">
      <h1>index<em>.ai</em></h1>
      <p class="tagline">A weekly index of AI and the creative industries</p>
    </div>
    <div class="masthead-meta">
      Updated weekly<br>Curated for BA Graphic &amp; Media Design
    </div>
  </header>

  <main>
    <div class="strand-row">
      <div></div>
      <div class="strand-label">AI &amp; Creative Industry</div>
      <div class="strand-label">Environmental Cost</div>
      <div class="strand-label">Creative Opposition</div>
    </div>

    <div class="content-row">
      <div class="meta-col">
        <div class="meta-week" id="meta-week">—</div>
        <div class="meta-count" id="meta-count">—</div>
        <div class="meta-count-label">items</div>
      </div>

      <div class="strand-col">
        <div id="list-a"></div>
      </div>
      <div class="strand-col">
        <div id="list-b"></div>
      </div>
      <div class="strand-col">
        <div id="list-c"></div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div></div>
    <div>
      <span class="footer-note" id="last-updated"></span>
    </div>
  </footer>

</div>
<script>
const CONTENT_URL = './content.json';

async function loadContent() {
  try {
    const res = await fetch(CONTENT_URL + '?t=' + Date.now());
    if (!res.ok) throw new Error();
    render(await res.json());
  } catch {
    ['a','b','c'].forEach(s =>
      document.getElementById('list-' + s).innerHTML =
        '<p class="state-msg">Content unavailable — check back soon.</p>'
    );
  }
}

function render(data) {
  const now = new Date();
  const weekStr = now.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });

  document.getElementById('meta-week').textContent = 'Week of ' + weekStr;

  const all = [...(data.a||[]), ...(data.b||[]), ...(data.c||[])];
  document.getElementById('meta-count').textContent =
    all.filter(i => i.status === 'approved').length;

  if (data.lastUpdated) {
    const d = new Date(data.lastUpdated);
    document.getElementById('last-updated').textContent =
      'Last updated ' + d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  }

  ['a','b','c'].forEach(strand => {
    const items = (data[strand]||[]).filter(i => i.status === 'approved');
    const list  = document.getElementById('list-' + strand);
    if (!items.length) {
      list.innerHTML = '<p class="state-msg">No items this week yet.</p>';
      return;
    }
    list.innerHTML = items.map(item => `
      <article class="item">
        ${item.image ? `<div class="item-image"><img src="${esc(item.image)}" alt="" loading="lazy" onerror="this.parentElement.style.display='none'"></div>` : ''}
        <div class="item-source">
          <span>${esc(item.source)}</span>
          <span class="item-date">${esc(item.date)}</span>
        </div>
        <h2 class="item-headline">${item.url
          ? `<a href="${esc(item.url)}" target="_blank" rel="noopener">${esc(item.headline)}</a>`
          : esc(item.headline)}</h2>
        <p class="item-summary">${esc(item.summary)}</p>
      </article>`).join('');
  });
}

function esc(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

loadContent();
</script>

</body>
</html>
